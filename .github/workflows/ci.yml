# Runs the same steps a new developer follows in README.md, on a clean machine:
# install, start Postgres and Redis with Docker Compose, migrate, check, build.
# If this passes, the documented setup works.
name: CI

on:
  push:
  pull_request:
  schedule:
    # Mondays 05:17 UTC. Catches new dependency advisories and anything that
    # stopped working without a commit (an image or an action changing).
    - cron: "17 5 * * 1"
  workflow_dispatch:

# The workflow only reads the repository. It uses no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    # A pull request from a branch in this repository is already covered by
    # the push run on that branch. Pull requests from forks have no push run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Actions are pinned to a commit, not a tag, so a moved tag cannot change
      # what runs here.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm
        # Corepack installs the pnpm version named in package.json.
        run: |
          corepack enable
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env from the example
        # Local development values only. The key below is generated for this
        # run and thrown away with the runner.
        run: |
          cp .env.example .env
          kek="$(openssl rand -base64 32)"
          sed -i "s|^VALTREXIA_LOCAL_KEK=.*|VALTREXIA_LOCAL_KEK=${kek}|" .env
          grep -q '^VALTREXIA_LOCAL_KEK=.\+' .env

      - name: Start Postgres and Redis
        run: pnpm infra:up

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Migrations match the schema
        run: pnpm db:check

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Seed demo data
        run: pnpm db:seed

      - name: Build the web app
        # No keys: the build needs none, so one image serves every environment.
        run: pnpm build

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200

  images:
    name: Container images
    # Builds the web, worker and migration images and runs them as production
    # would: read-only, unprivileged, against Postgres and Redis that require
    # TLS. See docker/smoke/run.sh.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the images and run them as production would
        run: docker/smoke/run.sh

  audit:
    name: Dependency audit
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Known vulnerabilities in production dependencies
        run: pnpm audit --prod
