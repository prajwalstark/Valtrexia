packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency install scripts unless they are listed here.
onlyBuiltDependencies:
  - "@prisma/engines"
  - esbuild
  - prisma

# eslint-plugin-react and friends (pulled in by eslint-config-next) have not
# widened their declared peer range to ESLint 10 yet, though they work with it.
# ESLint 9 is end-of-life. Remove this once the plugins catch up.
peerDependencyRules:
  allowedVersions:
    eslint: "10"

# Security fixes in dependencies of dependencies, until the package that
# pins them moves on. Each is scoped to the one path that needs it.
overrides:
  # GHSA-7589-6fvf-x4pw (ReDoS in Schema.TemplateLiteral), fixed in 3.22.1.
  # @prisma/config 7.10.1 pins effect 3.20.0; it is used only by Prisma's CLI.
  "@prisma/config>effect": 3.22.4
